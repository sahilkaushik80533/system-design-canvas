services:
  - type: web
    name: system-design-canvas-api
    runtime: python
    region: oregon
    repo: https://github.com/sahilkaushik80533/system-design-canvas
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false          # Set manually in Render dashboard — preserved across deploys
      - key: PYTHON_VERSION
        value: "3.11"
